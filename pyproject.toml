[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nxdo"
version = "0.2.26"
description = "Generate the next 10 project tasks from project state, git history and an LLM prompt."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "semcod" }, {name = "Tom Sapletta",email = "tom@sapletta.com"}]
keywords = ["planning", "llm", "git", "roadmap", "tasks"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
]
dependencies = [
  "pydantic>=2",
  "pydantic-settings>=2",
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
  "tenacity>=8",
  "pyyaml>=6.0",
  "planfile>=0.1.117",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-mock",
  "ruff",
  "mypy",
  "costs>=0.1.20",
  "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/semcod/nxdo"
Repository = "https://github.com/semcod/nxdo"
Issues = "https://github.com/semcod/nxdo/issues"

[project.scripts]
nxdo = "nxdo.cli:app_entry"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nxdo" = ["examples/**/*.yaml", "examples/**/*.yml", "examples/**/*.json", "examples/**/*.txt", "examples/**/*.md", "examples/**/*.sh"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Pinned explicit rule set: snapshot of the ruff 0.16 default rules that fire in
# this codebase, so the gate no longer depends on ambient ruff defaults.
select = [
  "E4", "E7", "E9", "F",
  "B008", "BLE001", "C401", "FLY002", "I001", "PIE810", "PLW1510",
  "RUF022", "RUF100", "S110", "S112", "SIM117", "TRY004", "UP045",
]

[tool.ruff.lint.per-file-ignores]
# typer.Argument/typer.Option must be called in parameter defaults.
"src/nxdo/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }

[tool.uv.dependency-groups.automation]
requires-python = ">=3.12"

[dependency-groups]
automation = ["goal>=2.2.0"]
