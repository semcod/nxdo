      description: "`pytest --collect-only` did not finish within 60s when invoked
        from the project root. koru scan cannot tell whether the suite is healthy
        or broken — it just hung.\n\nCommon root causes:\n- heavy module-level imports
        in `conftest.py` (database connect, network, model loading) running during
        *collection* instead of inside fixtures;\n- a pytest plugin (e.g. pytest-asyncio,
        pytest-django) blocking on a fixture that never resolves;\n- unbounded test
        discovery walking generated/build directories — fix with `norecursedirs` or
        `testpaths`;\n- circular imports between sub-packages that pytest tries to
        load as a single rootdir.\n\nReproduce locally:\n    timeout 60 python3 -m
        pytest --collect-only -q\n\nIf it still hangs, narrow scope:\n    pytest --collect-only
        -q --rootdir=. tests/\n    pytest --collect-only -q -p no:asyncio\n\nUntil
        this is fixed, `koru scan`'s pytest probe is non-actionable: it cannot distinguish
        a clean repo from a broken one."
